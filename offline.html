<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — DevFlow Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
  <div class="text-center">
    <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
      <i class="fas fa-wifi-slash text-3xl"></i>
    </div>
    <h1 class="text-2xl font-bold mb-2">You're Offline</h1>
    <p class="text-gray-400 mb-6 max-w-md">DevFlow Suite is designed to work offline. Some features may be limited. Check your connection and try again.</p>
    <button onclick="location.reload()" class="px-6 py-2 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg font-medium hover:shadow-lg transition-all">
      Retry
    </button>
  </div>
</body>
</html>
