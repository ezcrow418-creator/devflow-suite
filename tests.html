<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevFlow Suite — Unit Tests</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 2rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #f8fafc; }
    h1 span { color: #64748b; font-weight: 400; font-size: 0.875rem; }

    #test-results { max-width: 800px; }

    .suite { margin-bottom: 1.5rem; }
    .suite-name {
      font-size: 1rem;
      font-weight: 700;
      color: #94a3b8;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 0.5rem;
    }

    .test {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.4rem 0.5rem;
      border-radius: 6px;
      font-size: 0.875rem;
      transition: background 0.15s;
    }
    .test:hover { background: #1e293b; }

    .test .icon {
      flex-shrink: 0;
      width: 1.25rem;
      text-align: center;
      font-weight: 700;
    }
    .test.pass .icon { color: #22c55e; }
    .test.fail .icon { color: #ef4444; }

    .test .error {
      display: block;
      margin-top: 0.25rem;
      font-size: 0.75rem;
      color: #f87171;
      font-family: 'Fira Code', monospace;
      word-break: break-word;
    }

    .summary {
      margin-top: 2rem;
      padding: 1rem;
      background: #1e293b;
      border-radius: 8px;
      display: flex;
      gap: 1.5rem;
      font-weight: 600;
    }
    .summary .passed { color: #22c55e; }
    .summary .failed { color: #ef4444; }
    .summary .total { color: #64748b; }

    #run-btn {
      display: inline-block;
      margin-bottom: 1.5rem;
      padding: 0.5rem 1.25rem;
      background: linear-gradient(135deg, #3b82f8, #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #run-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <h1>🧪 DevFlow Suite — Unit Tests <span>v1.0</span></h1>
  <button id="run-btn" onclick="runTests()">▶ Run All Tests</button>
  <div id="test-results">
    <p style="color: #64748b;">Click "Run All Tests" to start.</p>
  </div>

  <!-- Load utilities first -->
  <script src="js/test-runner.js"></script>
  <script src="js/tools.js"></script>

  <!-- Load tests (after runner and source) -->
  <script src="js/tests.js"></script>

  <script>
    async function runTests() {
      const btn = document.getElementById('run-btn');
      btn.disabled = true;
      btn.textContent = '⏳ Running...';

      const result = await TestRunner.run('test-results');

      btn.disabled = false;
      btn.textContent = result.failed > 0
        ? `✗ ${result.failed} failed — Retry`
        : `✓ All ${result.total} passed — Re-run`;
    }
  </script>
</body>
</html>
